[project]
name = "space-invaders-oop"
version = "0.1.0"
description = "A production-grade Object-Oriented Space Invaders clone in Python and Pygame."
authors = [
    {name = "Azeem Sher", email = "azeem@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
    "pylint>=2.17",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "invalid-name",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-few-public-methods"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
